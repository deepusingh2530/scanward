name: docker

# Builds and smoke-tests the image on every relevant PR, and publishes a
# multi-arch image to GHCR on version tags.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "crates/**"
      - "rules/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Publish to GHCR under this version (empty = verify only)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # Fast feedback: build once on the runner's own architecture and prove the
  # image actually scans, instead of only compiling.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t scanward:verify .
      - name: Ships a rule corpus (the image is useless without one)
        run: docker run --rm --entrypoint scanward scanward:verify rule test /rules
      - name: Scans a mounted repository with no flags
        run: |
          docker run --rm -v "$PWD/testdata:/src:ro" scanward:verify \
            | tee /dev/stderr | grep -q "finding(s)"
      - name: Runs as non-root
        run: |
          # NOTE: flags for the container must follow the image, or docker eats them.
          uid="$(docker run --rm --entrypoint id scanward:verify -u)"
          test "$uid" != "0" || { echo "container must not run as root"; exit 1; }
          echo "uid=$uid"

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_version != '')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the version to publish
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "v=${{ inputs.publish_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.v }}
            type=raw,value=latest
          # metadata-action regenerates the OCI labels and would otherwise
          # replace the Dockerfile's with licences=NOASSERTION, which is exactly
          # the field enterprise image scanners read.
          labels: |
            org.opencontainers.image.title=scanward
            org.opencontainers.image.description=Fast, fully-offline multi-language SAST scanner
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.vendor=scanward contributors
            org.opencontainers.image.source=https://github.com/deepusingh2530/scanward
            org.opencontainers.image.documentation=https://github.com/deepusingh2530/scanward#readme
      - name: Build and push (multi-arch, with provenance + SBOM attestations)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Summary
        run: |
          echo "### Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker run --rm -v "$PWD:/src" '"${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"